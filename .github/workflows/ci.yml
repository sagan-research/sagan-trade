name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (lint)
        run: ruff check sagan/ sagan_trade/ tests/

      - name: Ruff (format check)
        run: ruff format --check sagan/ sagan_trade/ tests/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"
          pip install pytest pytest-cov pytest-xdist pytest-timeout

      - name: Security invariant
        run: test ! -e WQB_Submission/credentials.json

      - name: Run pytest
        run: |
          pytest tests/ -v --timeout=120

      - name: Build package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Verify source distribution contents
        run: |
          python - <<'PY'
          import tarfile, glob
          paths = glob.glob("dist/*.tar.gz")
          assert len(paths) == 1
          with tarfile.open(paths[0], "r:gz") as archive:
              names = archive.getnames()
          forbidden = [n for n in names if n.endswith(("credentials.json", ".exe", ".dll", ".so", ".dylib"))]
          assert not forbidden, forbidden
          print("Source distribution boundary verified")
          PY

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: pip install mkdocs-material "mkdocstrings[python]>=0.24" mkdocs-git-revision-date-localized-plugin

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site/
          retention-days: 7
