name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish to TestPyPI"
        required: false
        default: "false"
        type: boolean
      publish_pypi:
        description: "Publish to PyPI"
        required: false
        default: "false"
        type: boolean

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Validate distribution
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test before publish
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install from dist
        run: |
          pip install dist/*.whl

      - name: Run quick smoke test
        run: |
          python -c "
          import sagan_trade
          print(f'Sagan Trade v{sagan_trade.__version__} loaded successfully')
          assert hasattr(sagan_trade, 'AlmgrenChrissModel')
          assert hasattr(sagan_trade, 'HierarchicalRiskParity')
          assert hasattr(sagan_trade, 'FeatureEngine')
          print('All modules loaded correctly!')
          "

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_testpypi == 'true')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sagan-trade
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true')
    environment:
      name: pypi
      url: https://pypi.org/p/sagan-trade
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}

  notify:
    name: Notify on completion
    needs: [publish-pypi, create-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print status
        run: |
          echo "=== Deployment Status ==="
          echo "PyPI: ${{ needs.publish-pypi.result }}"
          echo "Release: ${{ needs.create-release.result }}"
          echo "Tag: ${{ github.ref_name }}"
          echo "========================"